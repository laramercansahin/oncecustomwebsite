<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speakers — Once Custom Sound</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/carousel.css">
<style>
#loader-logo{height:68px;filter:brightness(0) invert(1);opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s;}
.bar-back{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);text-decoration:none;display:flex;align-items:center;gap:10px;transition:color .2s,gap .2s;}
.bar-logo img{height:68px;filter:brightness(0) invert(1);}
.bar-lang button{background:none;border:none;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.16em;color:var(--mid);cursor:pointer;padding:4px 8px;transition:color .2s;}

/* ══════════════════════════════════
   ORBITAL-COVERFLOW SECTION
══════════════════════════════════ */
#coverflow-section{
  position:relative;
  width:100%;
  height:100vh;
  margin-top:80px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

/* header */
.cf-header{
  position:relative;
  width:100%;
  padding:40px 60px 0;
  z-index:10;
  flex-shrink:0;
}
.cf-sub{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ghost);margin-top:6px;}

/* ── 3D SCENE ── */
.cf-scene{
  position:relative;
  width:100%;
  height:50vh;
  perspective:1100px;
  display:flex;align-items:center;justify-content:center;
  flex:1;
}
.cf-soon-badge{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  font-family:'Jost',sans-serif;font-size:10px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;
  color:var(--bronze);background:rgba(15,13,10,.85);border:1px solid rgba(200,121,65,.4);
  padding:5px 14px;white-space:nowrap;pointer-events:none;z-index:10;
}
.slide-soon-badge{
  display:inline-block;font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--bronze);border:1px solid rgba(200,121,65,.4);padding:5px 16px;margin-bottom:16px;
}
.cf-info-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(36px,5vw,68px);
  letter-spacing:.08em;color:var(--cream);line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,.8);
}
.cf-info-hint{
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--mid);margin-top:14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  pointer-events:auto;cursor:pointer;
}

/* ── LEFT: museum caption panel ── */
.slide-content{
  position:relative;z-index:3;
  padding:160px 0 60px 72px;
  align-items:flex-start;
  width:46%;
  height:100%;
  display:flex;align-items:flex-start;
}

/* artist name — large, minimal */
.slide-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(40px,5vw,72px);
  letter-spacing:.12em;line-height:1;
  color:var(--cream);
  transform:translateY(20px);opacity:0;
  transition:transform .85s cubic-bezier(.22,1,.36,1) .1s,opacity .85s ease .1s;
}

/* medium line — "Once Custom Sound, İstanbul" */
.slide-maker{
  font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--bronze);opacity:.8;
  margin-top:12px;
  transform:translateY(14px);opacity:0;
  transition:transform .8s ease .18s,opacity .8s ease .18s;
}

/* tagline — italic subtitle */
.slide-tagline{
  font-size:18px;font-weight:300;font-style:italic;
  letter-spacing:.05em;line-height:2;
  color:rgba(237,228,213,.8);
  margin-top:12px;
  transform:translateY(14px);opacity:0;
  transition:transform .8s ease .25s,opacity .8s ease .25s;
}
.spec-label{
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bronze);margin-bottom:4px;
}
.spec-val{
  font-size:15px;letter-spacing:.02em;font-weight:300;
  color:rgba(237,228,213,.95);line-height:1.6;
}

/* back to coverflow button */
.back-to-orbit{
  position:absolute;top:104px;left:48px;z-index:10;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--mid);cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:color .2s,gap .2s;
  text-decoration:none;
}
</style>
</head>
<body class="tr">

<div id="loader">
  <img src="https://www.oncecustom.com/images/logo.png" id="loader-logo" alt="">
  <div id="lbar"></div>
</div>

<header class="bar">
  <a href="index.html" class="bar-back">
    <span data-lang="en">Home</span><span data-lang="tr">Ana Sayfa</span>
  </a>
  <div class="bar-logo"><img src="https://www.oncecustom.com/images/logo.png" alt="Once Custom Sound"></div>
  <div class="bar-lang">
    <button id="btnEN" onclick="setLang('en')">EN</button>
    <span style="color:var(--border);font-size:11px">|</span>
    <button id="btnTR" onclick="setLang('tr')" class="active">TR</button>
  </div>
</header>

<!-- ORBITAL-COVERFLOW CATALOG -->
<section id="coverflow-section">
  <div class="cf-bg"></div>
  <div class="cf-header">
    <div class="cf-title"><span data-lang="en">The Collection</span><span data-lang="tr">Koleksiyon</span></div>

  </div>

  <div class="cf-scene" id="cfScene">
    <div class="cf-ring" id="cfRing"></div>
    <div class="cf-floor"></div>
  </div>

  <div class="cf-info">
    <div class="cf-info-name" id="cfName"></div>
    <div class="cf-info-tag" id="cfTag"></div>
    <div class="cf-info-hint" id="exploreHint">
      <span data-lang="en">click to explore</span>
      <span data-lang="tr">keşfetmek için tıkla</span>
    </div>
  </div>

  <div class="cf-nav">
    <button class="cf-btn" id="cfPrev" onclick="cfGo(-1)">←</button>
    <div class="cf-counter"><em id="cfCur">01</em> / <span id="cfTot"></span></div>
    <button class="cf-btn" id="cfNext" onclick="cfGo(1)">→</button>
  </div>
</section>

<!-- DETAIL SLIDER -->
<section id="hero-section">
  <a href="#coverflow-section" class="back-to-orbit">
    <span data-lang="en">Back to collection</span>
    <span data-lang="tr">Koleksiyona dön</span>
  </a>
  <div id="slides"></div>
  <div class="nav-arr">
    <button class="arr-btn" id="btnUp" onclick="go(-1)">↑</button>
    <button class="arr-btn" id="btnDown" onclick="go(1)">↓</button>
  </div>
  <div class="dots" id="dotsWrap"></div>
  <div class="progress"><div class="progress-fill" id="progFill"></div></div>
</section>
